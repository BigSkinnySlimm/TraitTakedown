name: Build Native Android APK & Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-android:
    name: Compile Godot 4 Native APK & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download & Extract Godot 4.3 Headless Engine
        run: |
          mkdir -p "$HOME/godot_bin" "$HOME/.local/share/godot/export_templates/4.3.stable"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q Godot_v4.3-stable_linux.x86_64.zip -d "$HOME/godot_bin"
          chmod +x "$HOME/godot_bin/Godot_v4.3-stable_linux.x86_64"
          unzip -q Godot_v4.3-stable_export_templates.tpz
          mv templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"

      - name: Generate Signing Keystore & Configure Godot 4.3 Android SDK
        run: |
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          rm -f "$HOME/.android/debug.keystore"
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$HOME/.android/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SETTINGS_CONTENT=$(printf '[gd_resource type="EditorSettings" format=3]
[resource]
export/android/java_sdk_path = "%s"
export/android/android_sdk_path = "%s"
export/android/debug_keystore = "%s/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
' "$JAVA_HOME" "$ANDROID_HOME" "$HOME")
          echo "$SETTINGS_CONTENT" > "$HOME/.config/godot/editor_settings-4.tres"
          echo "$SETTINGS_CONTENT" > "$HOME/.config/godot/editor_settings-4.3.tres"

      - name: Compile Native Android APK & Web Preview
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
        run: |
          mkdir -p build/android build/web
          "$HOME/godot_bin/Godot_v4.3-stable_linux.x86_64" --headless --import
          "$HOME/godot_bin/Godot_v4.3-stable_linux.x86_64" --headless --export-debug "Android_APK" "$GITHUB_WORKSPACE/build/android/TraitTakedown-Android-Native.apk"
          "$HOME/godot_bin/Godot_v4.3-stable_linux.x86_64" --headless --export-release "Web_Portal_Engine" "$GITHUB_WORKSPACE/build/web/game.html" || true
          cp index.html build/web/index.html || true
          ls -lh build/android/TraitTakedown-Android-Native.apk

      - name: Publish Native APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.1.${{ github.run_number }}
          name: "Trait Takedown Native Android Release v7.1.${{ github.run_number }}"
          body: "Standalone Native Godot 4 (Vulkan) Android Build. Tap **TraitTakedown-Android-Native.apk** below to download and install."
          files: build/android/TraitTakedown-Android-Native.apk
